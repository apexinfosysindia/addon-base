# =============================================================================
# ApexOS base-image build — addon-base (build-pipeline owned).
#
# Installed in the product repo as .github/workflows/apexos-build.yml.
# PIPELINE-OWNED SURFACE (`.github/workflows/apexos-*.yml`): never hand-edit
# there — source of truth is build-pipeline tools/harness/ci/build/addon-base.yml.
#
# The add-on store's base image (task #53): apexinfosysindia/addons root
# build.yaml pins ghcr.io/apexinfosysindia/addon-base:15.0.4 — this workflow
# publishes that tag. amd64 + aarch64 (self-hosted apexos-builder, arch-routed by label)
# only, matching the docker-base fleet (no armhf/armv7/i386 runners; the
# store keeps all five build_from keys for shape, but only these two arches
# exist — PR #1 caveat). Production Dockerfile UNMODIFIED (plain curl+tar,
# no ADD --unpack — the docker driver suffices, unlike docker-base's
# container-builder variants). Every built image is denylist-gated
# (tools/gate via BUILD_PIPELINE_TOKEN checkout) with violations==0 AND
# skipped==0 asserted BEFORE any push. `image-gate` aggregates the matrix as
# the required status check.
#
# Push (main only):
#   ghcr.io/apexinfosysindia/addon-base:<ver> + :latest (GITHUB_TOKEN,
#     packages:write) — the store's pinned build_from resolves from here;
#   registry.apexinfosys.in/apexos/addon-base mirror — continue-on-error
#     while the box's token-server split is pending (blocked-on-box must
#     not redden the gate).
# Per-arch tags <ver>-{amd64,aarch64} are pushed by the build legs; the
# merge job stitches them into the <ver> + latest multi-arch manifests.
# <ver> = .apexos/provenance.yaml upstream.ref with the leading v dropped
# (v15.0.4 -> 15.0.4, the image-tag spelling the store pins).
# =============================================================================
name: apexos-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apexos-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_NS: ghcr.io/apexinfosysindia
  REGISTRY: registry.apexinfosys.in
  REGISTRY_NS: registry.apexinfosys.in/apexos
  IMAGE: addon-base

permissions:
  contents: read

jobs:
  build:
    name: base (${{ matrix.arch.name }})
    # dependabot's actor can't read org secrets (BUILD_PIPELINE_TOKEN,
    # REGISTRY_*) — skip instead of failing red; image-gate skips in
    # lockstep, and a skipped required check passes branch protection.
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch:
          # build_from spellings = base/build.yaml (upstream alpine 3.19.0
          # arch images; armhf/armv7/i386 skipped — no runners, and the
          # fleet ships amd64+aarch64 only, docker-base precedent)
          - name: amd64
            runner: [self-hosted, apexos-builder, linux, X64]
            build_from: amd64/alpine:3.19.0
          - name: aarch64
            runner: [self-hosted, apexos-builder, ARM64]
            build_from: arm64v8/alpine:3.19.0
    env:
      ARCH: ${{ matrix.arch.name }}
    steps:
      # The self-hosted builders share ONE disk across every job of every repo,
      # and nothing bounds what accumulates on it: BuildKit's cache, plus a
      # tagged image per leg per build. On 2026-08-12 the amd64 builder reached
      # zero bytes free and took out core's apexos-build (`docker save` ->
      # "no space left on device") and ten addons image builds (pip install
      # torch, same errno 28) within the hour. Hosted runners never showed this
      # because every job got a fresh disk.
      #
      # Trim only when the disk is actually tight, so a warm cache survives the
      # common case: dangling images first (nothing references them), then the
      # BuildKit cache down to a budget. `df -Pk` because the ARM64 builder is
      # macOS, where df has neither -BG nor --output.
      - name: reclaim disk when the shared builder is low
        run: |
          free_gb=$(df -Pk . | awk 'NR==2 {print int($4 / 1048576)}')
          echo "free before: $free_gb GiB"
          docker system df || true
          if [ "$free_gb" -lt 20 ]; then
            docker image prune -f || true
            docker buildx prune -f --keep-storage=10GB \
              || docker builder prune -f --keep-storage=10GB || true
            # Tagged build products pile up too (every leg tags <image>:ci and
            # the per-arch refs it pushes), and dangling-only pruning never
            # touches them. Sweep the unused ones older than a week -- on the
            # LINUX builder only: the ARM64 builder is a workstation with its
            # own images and stopped containers, and `prune -a` there would
            # sweep things this pipeline does not own.
            if [ "$(uname)" = "Linux" ]; then
              docker image prune -a -f --filter until=168h || true
            fi
            df -Ph .
          fi

      - name: checkout addon-base
        uses: actions/checkout@v4
        with:
          path: src
          persist-credentials: false

      - name: checkout build-pipeline (gate tool + master map)
        # BUILD_PIPELINE_TOKEN is an ed25519 SSH deploy key (READ-ONLY on
        # build-pipeline), NOT a PAT — actions/checkout `token:` cannot consume
        # it. Stored double-base64 so the secret survives newline mangling.
        env:
          BUILD_PIPELINE_KEY_B64: ${{ secrets.BUILD_PIPELINE_TOKEN }}
        run: |
          key_file=$(mktemp)
          chmod 600 "$key_file"
          echo "$BUILD_PIPELINE_KEY_B64" | base64 -d | base64 -d > "$key_file"
          # Idempotent: build workflows check the product repo out into `path: src`,
          # so the workspace ROOT is not a git repo and checkout's `git clean` never
          # sweeps this nested clone. Self-hosted workspaces persist between jobs, so
          # a second matrix leg on the same runner hit "destination path already
          # exists" (exit 128). Clear it before cloning.
          rm -rf .build-pipeline
          GIT_SSH_COMMAND="ssh -i $key_file -o StrictHostKeyChecking=accept-new" \
            git clone --depth=1 git@github.com:apexinfosysindia/build-pipeline.git .build-pipeline
          rm -f "$key_file"

      # NO actions/setup-python. On the self-hosted macOS builder its fallback
      # installer (actions/python-versions setup.sh) resolves the tool cache
      # from AGENT_TOOLSDIRECTORY, which setup-python itself pins to the
      # hosted-image path /Users/runner/hostedtoolcache -- a directory that
      # cannot exist here (the builder runs as 'advait'), so the step dies on
      # `mkdir: /Users/runner: Permission denied`. It also shells out to
      # `sudo installer`, which has no TTY on a runner.
      #
      # Provision from the runner's own interpreter instead. The Linux builder
      # (Ubuntu 24.04) ships python3.12 WITH PyYAML 6.0.1 but WITHOUT pip and
      # WITHOUT ensurepip -- so `python3 -m venv` fails there and there is no
      # pip to recover with. Probe for an interpreter that can already import
      # yaml and only install when none can. Neither builder exposes an
      # unversioned `python`, which the gate steps invoke, so always shim it.
      - name: provision python + gate deps (runner-native interpreter)
        run: |
          set -eu
          py=""
          cand=""
          for c in python3.12 python3.13 python3.11 python3 python; do
            p=$(command -v "$c" 2>/dev/null) || continue
            if [ -z "$cand" ]; then cand="$p"; fi
            if "$p" -c 'import yaml' 2>/dev/null; then py="$p"; break; fi
          done
          if [ -z "$py" ]; then
            if [ -z "$cand" ]; then echo "no python3 on this runner" >&2; exit 1; fi
            py="$cand"
            venv="$RUNNER_TEMP/gatevenv"
            if "$py" -m venv "$venv" 2>/dev/null && "$venv/bin/python" -m pip --version >/dev/null 2>&1; then
              "$venv/bin/python" -m pip install -q --disable-pip-version-check pyyaml
              py="$venv/bin/python"
            elif "$py" -m pip install -q --user --break-system-packages pyyaml 2>/dev/null; then
              :
            else
              "$py" -m pip install -q --user pyyaml
            fi
          fi
          "$py" -c 'import sys, yaml; print(sys.version, "pyyaml", yaml.__version__)'
          shim="$RUNNER_TEMP/pyshim"
          mkdir -p "$shim"
          ln -sf "$py" "$shim/python"
          echo "$shim" >> "$GITHUB_PATH"

      - name: read version (.apexos/provenance.yaml upstream.ref, v-stripped)
        id: version
        run: |
          v=$(python -c "import yaml; print(yaml.safe_load(open('src/.apexos/provenance.yaml'))['upstream']['ref'].lstrip('v'))")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: build addon-base:${{ steps.version.outputs.version }} (production Dockerfile, unmodified)
        env:
          BUILD_FROM: ${{ matrix.arch.build_from }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx build --load src/base \
            --build-arg "BUILD_FROM=$BUILD_FROM" \
            --build-arg "BUILD_ARCH=$ARCH" \
            --build-arg "BUILD_VERSION=$VERSION" \
            --build-arg "BUILD_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "BUILD_REPOSITORY=$GITHUB_REPOSITORY" \
            --label "io.apexos.version=$VERSION" \
            -t "$IMAGE:ci"

      - name: gate built image (denylist, violations==0 && skipped==0)
        working-directory: .build-pipeline/tools/gate
        run: |
          docker save "$IMAGE:ci" -o "$RUNNER_TEMP/image.tar"
          rc=0
          python -m apexos_gate --map ../../transform/rename-map.yaml --json "$RUNNER_TEMP/image.tar" \
            > "$RUNNER_TEMP/gate.json" || rc=$?
          python - "$RUNNER_TEMP/gate.json" "$rc" <<'PY'
          import json, sys

          gr = json.load(open(sys.argv[1]))
          rc = int(sys.argv[2])
          st = gr["stats"]
          print(f"gate: exit={rc} violations={st['violations']} "
                f"allowed={st['allowed']} skipped={st['skipped']} errors={st['errors']}")
          for v in gr["violations"][:25]:
              print(f"  VIOLATION {v.get('term')!r}: {v.get('path')}")
          for s in gr["skipped"][:25]:
              print(f"  SKIPPED {s.get('path')}: {s.get('reason')}")
          # REQUIRED: clean gate AND zero skips (a skipped file is an unscanned file)
          sys.exit(1 if rc != 0 or st["violations"] or st["skipped"] or st["errors"] else 0)
          PY

      - name: push per-arch image to ghcr (main only)
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ref="$GHCR_NS/$IMAGE:$VERSION-$ARCH"
          docker tag "$IMAGE:ci" "$ref"
          docker push "$ref"

      - name: push per-arch image to registry mirror (blocked-on-box tolerated)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_PASSWORD not set — skipping registry push"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          ref="$REGISTRY_NS/$IMAGE:$VERSION-$ARCH"
          docker tag "$IMAGE:ci" "$ref"
          docker push "$ref"

  image-gate:
    name: image-gate
    needs: build
    # always() so a FAILED build still turns the gate red; the dependabot
    # term skips the required check in lockstep with build (skipped counts
    # as passing). Job name is the required-status-check — never rename.
    if: always() && github.actor != 'dependabot[bot]'
    runs-on: [self-hosted, apexos-builder, linux, X64]
    steps:
      - name: assert every arch built and passed the denylist gate
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix result: $RESULT"
          test "$RESULT" = "success"

  merge:
    name: publish multi-arch manifests
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, apexos-builder, linux, X64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout addon-base (provenance only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: read version
        id: version
        run: |
          v=$(python3 -c "import yaml; print(yaml.safe_load(open('.apexos/provenance.yaml'))['upstream']['ref'].lstrip('v'))")
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: create ghcr multi-arch manifests (<ver> + latest)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            -t "$GHCR_NS/addon-base:$VERSION" \
            -t "$GHCR_NS/addon-base:latest" \
            "$GHCR_NS/addon-base:$VERSION-amd64" \
            "$GHCR_NS/addon-base:$VERSION-aarch64"

      - name: create registry mirror manifest (blocked-on-box tolerated)
        continue-on-error: true
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::warning::REGISTRY_PASSWORD not set — skipping registry manifest"
            exit 1
          fi
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker buildx imagetools create \
            -t "$REGISTRY_NS/addon-base:$VERSION" \
            "$REGISTRY_NS/addon-base:$VERSION-amd64" \
            "$REGISTRY_NS/addon-base:$VERSION-aarch64"
